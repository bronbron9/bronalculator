<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bronalculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #121214; color: #e4e4e7; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto font-sans">

    <div class="bg-[#1e1e24] rounded-2xl p-5 shadow-xl border border-zinc-800">
        <h1 class="text-xl font-bold text-center mb-6 text-emerald-400 font-mono tracking-wide">Bronalculator</h1>
        
        <!-- Tabs -->
        <div class="flex border-b border-zinc-800 mb-6">
            <button id="tab-conv-btn" onclick="switchTab('conv')" class="w-1/2 pb-3 font-semibold text-center border-b-2 border-emerald-500 text-emerald-400 transition-all">Converter</button>
            <button id="tab-devig-btn" onclick="switchTab('devig')" class="w-1/2 pb-3 font-semibold text-center border-b-2 border-transparent text-zinc-400 transition-all">Devig</button>
        </div>

        <!-- Tab 1: Converter -->
        <div id="tab-conv" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">American Odds</label>
                <input id="input-american" type="text" oninput="convert('american')" placeholder="e.g., +150 or -110" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 font-mono">
            </div>
            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Decimal Odds</label>
                <input id="input-decimal" type="number" step="0.01" oninput="convert('decimal')" placeholder="e.g., 2.50" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 font-mono">
            </div>
            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Implied Probability (%)</label>
                <input id="input-prob" type="number" step="0.1" oninput="convert('prob')" placeholder="e.g., 40" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 font-mono">
            </div>
        </div>

        <!-- Tab 2: Devig -->
        <div id="tab-devig" class="hidden">
            <div class="mb-6">
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Market Odds (split by /)</label>
                <input id="input-devig" type="text" value="300/-425" oninput="calculateDevig()" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 font-mono tracking-light">
            </div>
            
            <hr class="border-zinc-800/80 my-4">
            
            <div id="devig-results" class="space-y-3">
                <!-- JavaScript populates results here -->
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const convTab = document.getElementById('tab-conv');
            const devigTab = document.getElementById('tab-devig');
            const convBtn = document.getElementById('tab-conv-btn');
            const devigBtn = document.getElementById('tab-devig-btn');

            if (tab === 'conv') {
                convTab.classList.remove('hidden');
                devigTab.classList.add('hidden');
                convBtn.className = "w-1/2 pb-3 font-semibold text-center border-b-2 border-emerald-500 text-emerald-400 transition-all";
                devigBtn.className = "w-1/2 pb-3 font-semibold text-center border-b-2 border-transparent text-zinc-400 transition-all";
            } else {
                convTab.classList.add('hidden');
                devigTab.classList.remove('hidden');
                convBtn.className = "w-1/2 pb-3 font-semibold text-center border-b-2 border-transparent text-zinc-400 transition-all";
                devigBtn.className = "w-1/2 pb-3 font-semibold text-center border-b-2 border-emerald-500 text-emerald-400 transition-all";
                calculateDevig();
            }
        }

        function americanToProb(american) {
            let num = parseFloat(american);
            if (isNaN(num)) return null;
            if (num > 0) return 100 / (num + 100);
            if (num < 0) return Math.abs(num) / (Math.abs(num) + 100);
            return null;
        }

        function probToAmerican(prob) {
            if (prob <= 0 || prob >= 1) return '';
            if (prob === 0.5) return '+100';
            if (prob < 0.5) {
                let val = Math.round((100 / prob) - 100);
                return '+' + val;
            } else {
                let val = Math.round((prob * 100) / (1 - prob));
                return '-' + val;
            }
        }

        function convert(source) {
            const amInput = document.getElementById('input-american');
            const decInput = document.getElementById('input-decimal');
            const probInput = document.getElementById('input-prob');

            if (source === 'american') {
                let p = americanToProb(amInput.value);
                if (p !== null) {
                    decInput.value = (1 / p).toFixed(2);
                    probInput.value = (p * 100).toFixed(1);
                }
            } else if (source === 'decimal') {
                let d = parseFloat(decInput.value);
                if (!isNaN(d) && d > 1) {
                    let p = 1 / d;
                    probInput.value = (p * 100).toFixed(1);
                    amInput.value = probToAmerican(p);
                }
            } else if (source === 'prob') {
                let pPct = parseFloat(probInput.value);
                if (!isNaN(pPct) && pPct > 0 && pPct < 100) {
                    let p = pPct / 100;
                    decInput.value = (1 / p).toFixed(2);
                    amInput.value = probToAmerican(p);
                }
            }
        }

        function calculateDevig() {
            const input = document.getElementById('input-devig').value;
            const container = document.getElementById('devig-results');
            
            const oddsArray = input.split(/[\/, ]+/).filter(x => x.trim() !== '');
            if (oddsArray.length < 2) {
                container.innerHTML = '<p class="text-zinc-500 text-xs italic text-center py-4">Enter 2 or more odds separated by slashes...</p>';
                return;
            }

            let rawProbs = [];
            let totalImplied = 0;
            let valid = true;

            oddsArray.forEach(oddStr => {
                let prob = americanToProb(oddStr);
                if (prob === null) valid = false;
                rawProbs.push(prob);
                totalImplied += prob;
            });

            if (!valid) {
                container.innerHTML = '<p class="text-rose-400 text-xs text-center py-4">Invalid American odds input detected.</p>';
                return;
            }

            let juice = (totalImplied - 1) * 100;

            let html = `
                <div class="bg-zinc-900/50 border border-zinc-800 rounded-xl p-3 flex justify-between text-xs font-mono">
                    <span class="text-zinc-400">Total Book Market: ${(totalImplied * 100).toFixed(1)}%</span>
                    <span class="text-emerald-400 font-bold">Juice/Overround: ${juice.toFixed(1)}%</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm mt-2 font-mono">
                        <thead>
                            <tr class="text-zinc-500 text-xs uppercase border-b border-zinc-800">
                                <th class="pb-2">Line</th>
                                <th class="pb-2 text-right">Raw Prob</th>
                                <th class="pb-2 text-right text-emerald-400">Fair Prob</th>
                                <th class="pb-2 text-right text-emerald-400">Fair Odds</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-zinc-800/50">
            `;

            oddsArray.forEach((odd, index) => {
                let rawProb = rawProbs[index];
                let fairProb = rawProb / totalImplied;
                let fairAmerican = probToAmerican(fairProb);

                html += `
                    <tr>
                        <td class="py-2.5 font-bold text-white">${odd.startsWith('-') || odd.startsWith('+') ? odd : '+' + odd}</td>
                        <td class="py-2.5 text-right text-zinc-400">${(rawProb * 100).toFixed(1)}%</td>
                        <td class="py-2.5 text-right text-emerald-400 font-semibold">${(fairProb * 100).toFixed(1)}%</td>
                        <td class="py-2.5 text-right text-emerald-400 font-bold">${fairAmerican}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        window.onload = function() {
            document.getElementById('input-american').value = '+150';
            convert('american');
        }
    </script>
</body>
</html>
